name: Fetch Sky Data & deploy
on:
  workflow_dispatch: {}

concurrency:
  group: skydata
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-data-logic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install requests
      - name: Fetch raw
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            set -euo pipefail
            python scripts/fetch_raw.py
            for f in iaplist.json generic.json events.json; do
              test -s "raw/$f" || { echo "raw/$f 缺失或為空"; exit 1; }
            done
        env:
          B: ${{ secrets.B }}
          LOGIN_BODY: ${{ secrets.LOGIN_BODY }}
          LOGIN_HEADERS: ${{ secrets.LOGIN_HEADERS }}

      - name: Fetch image manifest
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 15
          command: "curl -fsS --max-time 60 -o raw/manifest.json https://skyinfoweb.pages.dev/image/manifest.json"
      
      # 任務文字改讀 repo 裡的 i18n/quests.{tw,cn,en}.json，不再需要 QUEST_TW / QUEST_EN_1 / QUEST_EN_2 / QUEST_CN 四個 secret。
      - name: Build quest data
        run: python scripts/build_quest.py

      - name: Build shop data
        run: python scripts/build_shop.py

      # 上一步萬一寫出壞 JSON，在這裡擋下來，也不要 commit 一份會讓前端整頁載入失敗的檔案。
      - name: Verify output
        run: |
          python - <<'PY'
          import json, sys, time
          for p in ("data.json", "data/iap.json", "data/shop.json", "data/events.json"):
              with open(p, encoding="utf-8") as f:
                  d = json.load(f)
              print(f"{p}: OK")
              meta = d.get("meta")
              if meta:
                  age = time.time() - meta["fetchedAt"]
                  if age > 6 * 3600:
                      sys.exit(f"{p} 的 fetchedAt 已經 {age/3600:.1f} 小時前，抓取可能沒成功")
          PY

      - name: Deploy Worker (site + API)
        if: github.ref == 'refs/heads/main'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 20
          command: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json archive/ data/
          git commit -m "Update data & archive $(TZ='Asia/Taipei' date +%Y-%m-%d)" || exit 0
          git push
